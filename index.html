<style>
/* Night-stage look: black room, amber stage light, heavy uppercase type. */
:root{
  --bg:#0b0b0d; --ink:#f2efe8; --muted:#8f8b82; --rule:#24232a; --amber:#ffb23e; --card:#141419;
  --sans:'Avenir Next','Avenir','Figtree','Helvetica Neue',Arial,sans-serif;
  --mono:var(--sans); /* one typeface across the site */
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Splash */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;overflow:hidden;transition:opacity .6s ease,visibility .6s}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;filter:saturate(.9)}
.splash::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(0,0,0,.1),rgba(0,0,0,.75))}
.splash-in{position:relative;z-index:1;text-align:center;padding:24px}
.splash .welcome{font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.splash h1{margin:0;font-weight:900;font-size:clamp(42px,9vw,128px);line-height:.92;letter-spacing:-.01em}
.splash h1 small{font-size:1em;font-weight:inherit;letter-spacing:inherit}
.enter{margin-top:34px;background:none;border:2px solid var(--amber);color:var(--amber);padding:12px 34px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.enter:hover{background:var(--amber);color:#000}
body.entered .splash{opacity:0;visibility:hidden}

/* Header */
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid var(--rule)}
.logo{font-weight:900;font-size:clamp(18px,2.4vw,24px);text-decoration:none;letter-spacing:.01em}
.logo span{font:inherit;color:inherit}
.mast nav{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase}
.mast nav a{text-decoration:none;color:var(--muted)}
.mast nav a:hover{color:var(--amber)}

/* Index */
.lede{padding-block:clamp(28px,6vw,64px) clamp(18px,3vw,30px);display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.lede h2{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(34px,6vw,76px);line-height:.95}
.lede p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,22px);padding-bottom:56px}
@media (max-width:980px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.projects{grid-template-columns:1fr}}
.proj{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--card);text-decoration:none}
.proj img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease,opacity .3s;opacity:.82}
.proj:hover img{transform:scale(1.04);opacity:1}
.proj .lbl{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:space-between;align-items:end;gap:10px}
.proj h3{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(18px,2vw,24px);line-height:1}
.proj .n{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em;white-space:nowrap}
.proj.soon{display:grid;place-items:center;border:1px dashed #34333b;cursor:default}
.proj.soon h3{color:var(--muted);text-align:center;padding:0 16px}
.proj.soon .n{color:var(--muted)}
.proj.soon .lbl{background:none}

/* Project page */
.phead{padding-block:clamp(26px,5vw,56px) 22px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.phead h2{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(38px,7vw,96px);line-height:.92}
.phead p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.back{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--amber)}
.grid{columns:3 300px;column-gap:14px;padding-bottom:40px}
.grid button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:var(--card);cursor:zoom-in;break-inside:avoid}
.grid img{width:100%}
.pnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-block:20px 8px;font-weight:900;text-transform:uppercase}
.pnav a{text-decoration:none}
.pnav a:hover{color:var(--amber)}
.pnav small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:88vh;width:auto;height:auto;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font-size:30px;cursor:pointer;padding:14px 18px}
.lb button:hover{color:var(--amber)}
.lb .x{top:6px;right:8px}.lb .pv{left:4px;top:50%;transform:translateY(-50%)}.lb .nx{right:4px;top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

footer{border-top:1px solid var(--rule);padding-block:20px 30px;display:flex;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
footer nav{display:flex;gap:18px;flex-wrap:wrap}
footer a{text-decoration:none}
footer a:hover{color:var(--amber)}
/* Small labels share the title's typeface, in a bold weight. */
.splash .welcome,.mast nav,.lede p,.phead p,.back,.pnav small,.lb .ct,footer{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

// Same order as the old Adobe Portfolio site. `cover` is the photo number (1-based) used on the project tile; `pos` sets its crop (CSS object-position). A project with no photos shows as "coming soon".
const PROJECTS = [
  {slug:"the-barnes", title:"The Barnes", key:"the-barnes", cover:23},
  {slug:"the-carvers", title:"The Carvers", key:"the-carvers", cover:106},
  {slug:"no-layups", title:"No Layups", key:"no-layups", cover:33, year:"2022"},
  {slug:"real-men-real-talk", title:"Real Men / Real Talk", key:"real-men", cover:97},
  {slug:"warped-whores", title:"Warped Whores", key:"warped", cover:7, pos:"50% 30%", year:"2023"},
  {slug:"startup-huddle", title:"Startup Huddle", key:"startup-huddle", cover:36, year:"2023"},
  {slug:"gigi-noire", title:"Gigi Noire", key:"gigi", cover:13},
  {slug:"khaled", title:"Khaled", key:"khaled", cover:43, pos:"50% 40%"},
  {slug:"justin-moyar-blues", title:"Justin Moyar Blues", key:"justin-moyar", cover:4, pos:"50% 10%"}
];
const view = document.getElementById('view');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const live = PROJECTS.filter(p => p.key && PHOTOS[p.key]);

function indexView(){
  document.title = "THE CITY of ANGLEs";
  view.innerHTML = `<section class="lede"><h2>Projects</h2><p>${PROJECTS.length} projects</p></section>
  <div class="projects">${PROJECTS.map(p => {
    const ph = p.key && PHOTOS[p.key];
    if (!ph) return `<div class="proj soon"><h3>${esc(p.title)}</h3><div class="lbl"><span class="n">Coming soon</span></div></div>`;
    const c = ph[(p.cover||1)-1] || ph[0];
    return `<a class="proj" href="#/${p.slug}"><img src="img/${c[0]}" width="${c[1]}" height="${c[2]}"${p.pos ? ` style="object-position:${p.pos}"` : ''} alt="" loading="lazy"><div class="lbl"><h3>${esc(p.title)}</h3></div></a>`;
  }).join('')}</div>`;
}

let cur = [], idx = 0;
function projectView(p){
  const ph = PHOTOS[p.key]; cur = ph;
  document.title = p.title.toUpperCase() + " | THE CITY of ANGLEs";
  const li = live.indexOf(p), prev = live[(li-1+live.length)%live.length], next = live[(li+1)%live.length];
  view.innerHTML = `<section class="phead"><div><a class="back" href="#/">← All projects</a><h2>${esc(p.title)}</h2></div><p>${p.year ? p.year + ' · ' : ''}${ph.length} photos</p></section>
  <div class="grid">${ph.map((f,i) => `<button data-i="${i}" aria-label="Open photo ${i+1}"><img src="img/${f[0]}" width="${f[1]}" height="${f[2]}" alt="${esc(p.title)}, photo ${i+1}" loading="lazy"></button>`).join('')}</div>
  <nav class="pnav"><a href="#/${prev.slug}"><small>Previous</small>${esc(prev.title)}</a><a href="#/${next.slug}" style="text-align:right"><small>Next</small>${esc(next.title)}</a></nav>`;
  view.querySelectorAll('.grid button').forEach(b => b.onclick = () => openLb(+b.dataset.i));
}

function route(){
  const slug = location.hash.replace(/^#\/?/, '');
  const p = PROJECTS.find(x => x.slug === slug && x.key && PHOTOS[x.key]);
  if (p) projectView(p); else indexView();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);

// Lightbox
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbc = document.getElementById('lbc');
function show(){ const f = cur[idx]; lbimg.src = 'img/' + f[0]; lbc.textContent = (idx+1) + ' / ' + cur.length; }
function openLb(i){ idx = i; show(); lb.classList.add('on'); document.getElementById('lbx').focus(); }
function closeLb(){ lb.classList.remove('on'); }
function step(d){ idx = (idx + d + cur.length) % cur.length; show(); }
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbp').onclick = () => step(-1);
document.getElementById('lbn').onclick = () => step(1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
let tx = null;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

// Splash shows once per visit; deep links skip it.
function enter(){ document.body.classList.add('entered'); try { sessionStorage.setItem('tcoa-in','1'); } catch(e){} }
document.getElementById('enter').onclick = enter;
let seen = false; try { seen = sessionStorage.getItem('tcoa-in') === '1'; } catch(e){}
if (seen || location.hash.length > 2) enter();
route();
</script>
