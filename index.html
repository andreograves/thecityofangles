<style>
/* Night-stage look: black room, amber stage light, heavy uppercase type. */
:root{
  --bg:#0b0b0d; --ink:#f2efe8; --muted:#8f8b82; --rule:#24232a; --amber:#ffb23e; --card:#141419;
  --sans:'Avenir Next','Avenir','Figtree','Helvetica Neue',Arial,sans-serif;
  --mono:var(--sans); /* one typeface across the site */
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;overflow-x:hidden;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit}
img{display:block;max-width:100%;height:auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--amber);outline-offset:3px}
.wrap{max-width:1440px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Splash */
.splash{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#000;overflow:hidden;transition:opacity .6s ease,visibility .6s}
.splash img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.9}
.splash::after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 45%,rgba(0,0,0,.35),rgba(0,0,0,.6))}
.splash .splash-in{text-shadow:0 2px 24px rgba(0,0,0,.55);padding-top:30vh} /* sits below the skyline */
.splash img{object-position:50% 40%}
.splash-in{position:relative;z-index:1;text-align:center;padding:24px}
.splash .welcome{font-family:var(--mono);font-size:clamp(13px,1.6vw,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--amber);margin:0 0 14px}
.splash h1{margin:0;font-weight:900;font-size:clamp(42px,9vw,128px);line-height:.92;letter-spacing:-.01em}
.splash h1 small{font-size:1em;font-weight:inherit;letter-spacing:inherit}
.enter{margin-top:34px;background:none;border:2px solid var(--amber);color:var(--amber);padding:12px 34px;font-weight:700;letter-spacing:.3em;text-transform:uppercase;cursor:pointer}
.enter:hover{background:var(--amber);color:#000}
body.entered .splash{opacity:0;visibility:hidden}

/* Header */
.mast{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-block:20px;border-bottom:1px solid var(--rule)}
.logo{font-weight:900;font-size:clamp(18px,2.4vw,24px);text-decoration:none;letter-spacing:.01em}
.logo span{font:inherit;color:inherit}
.logo:hover{color:var(--amber)}
.homebtn{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border:1.5px solid var(--amber);border-radius:999px;color:var(--amber);text-decoration:none;font-weight:700;font-size:12px;letter-spacing:.18em;text-transform:uppercase;transition:background .2s,color .2s}
.homebtn:hover{background:var(--amber);color:#000}
.homebtn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Index */
.lede{padding-block:clamp(28px,6vw,64px) clamp(18px,3vw,30px);display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.lede h2{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(34px,6vw,76px);line-height:.95}
.lede p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.projects{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(12px,1.6vw,22px);padding-bottom:56px}
@media (max-width:980px){.projects{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.projects{grid-template-columns:1fr}}
.proj{position:relative;display:block;aspect-ratio:4/3;overflow:hidden;background:var(--card);text-decoration:none}
.proj img{width:100%;height:100%;object-fit:cover;transition:transform .6s ease,opacity .3s;opacity:.82}
.proj:hover img{transform:scale(1.04);opacity:1}
.proj .lbl{position:absolute;left:0;right:0;bottom:0;padding:14px 16px;background:linear-gradient(transparent,rgba(0,0,0,.85));display:flex;justify-content:space-between;align-items:end;gap:10px}
.proj h3{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(18px,2vw,24px);line-height:1}
.proj .n{font-family:var(--mono);font-size:11px;color:var(--amber);letter-spacing:.08em;white-space:nowrap}
.proj.soon{display:grid;place-items:center;border:1px dashed #34333b;cursor:default}
.proj.soon h3{color:var(--muted);text-align:center;padding:0 16px}
.proj.soon .n{color:var(--muted)}
.proj.soon .lbl{background:none}

/* Project page */
.phead{padding-block:clamp(26px,5vw,56px) 22px;display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap}
.phead h2{margin:0;font-weight:900;text-transform:uppercase;font-size:clamp(38px,7vw,96px);line-height:.92}
.phead p{margin:0;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.06em}
.back{position:relative;z-index:1;display:inline-flex;align-items:center;min-height:44px;margin-bottom:16px;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-decoration:none;color:var(--amber)}
.grid{columns:3 300px;column-gap:14px;padding-bottom:40px}
.grid button{display:block;width:100%;margin:0 0 14px;padding:0;border:0;background:var(--card);cursor:zoom-in;break-inside:avoid}
.grid img{width:100%}
.pnav{display:flex;justify-content:space-between;gap:12px;border-top:1px solid var(--rule);padding-block:20px 8px;font-weight:900;text-transform:uppercase}
.pnav a{text-decoration:none}
.pnav a:hover{color:var(--amber)}
.pnav small{display:block;font-family:var(--mono);font-weight:400;font-size:11px;color:var(--muted);letter-spacing:.1em}

/* Lightbox */
.lb{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.95);display:none;align-items:center;justify-content:center}
.lb.on{display:flex}
.lb img{max-width:94vw;max-height:88vh;width:auto;height:auto;object-fit:contain}
.lb button{position:absolute;background:none;border:0;color:var(--ink);font-size:30px;cursor:pointer;padding:14px 18px}
.lb button:hover{color:var(--amber)}
.lb .x{top:6px;right:8px}.lb .pv{left:4px;top:50%;transform:translateY(-50%)}.lb .nx{right:4px;top:50%;transform:translateY(-50%)}
.lb .ct{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-family:var(--mono);font-size:12px;color:var(--muted)}

footer{border-top:1px solid var(--rule);padding-block:28px 34px;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em}
.social{display:flex;justify-content:center;gap:14px}
.social a{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--muted);color:var(--ink);display:grid;place-items:center;transition:color .2s,border-color .2s,background .2s}
.social a:hover{color:#000;background:var(--amber);border-color:var(--amber)}
.social svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.social svg .dot,.social svg .fill{fill:currentColor;stroke:none}
/* Small labels share the title's typeface, in a bold weight. */
.splash .welcome,.lede p,.phead p,.back,.pnav small,.lb .ct,footer{font-weight:700}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}


/* Matching album layout: centered headings, uniform 4:3 previews and shuffled order. */
.phead{display:block;text-align:center;padding-bottom:28px}
.phead .back{display:flex;width:max-content;margin:0 auto 18px}
.phead h2{font-size:clamp(30px,4vw,56px);line-height:1.08}
.phead p{margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));columns:auto;gap:0;margin-inline:clamp(4px,2vw,40px)}
.grid button{margin:0;aspect-ratio:4/3;overflow:hidden}
.grid img{width:100%;height:100%;object-fit:cover;object-position:50% 20%}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:700px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));margin-inline:0}}

.mast .homebtn{border:0;border-radius:0;padding:9px 0;font-family:var(--sans);font-weight:900;letter-spacing:0;font-size:16px;color:var(--ink)}
.mast .homebtn:hover{background:transparent;color:var(--amber)}

.cover-toolbar{padding:20px 0;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.cover-toolbar p,.cover-toolbar output{flex-basis:100%;margin:0;color:var(--muted);font-size:13px}
.cover-toolbar button,#cover-dialog button{background:transparent;border:1px solid var(--amber);padding:10px 16px;color:var(--amber);cursor:pointer}
.cover-toolbar textarea{width:100%;min-height:120px}
#cover-dialog{width:min(620px,94vw);max-height:94vh;overflow:auto;background:var(--bg);color:var(--ink);border:1px solid var(--rule);padding:24px}
#cover-dialog::backdrop{background:rgba(0,0,0,.85)}
#cover-dialog h2{font-size:24px;margin:0 0 18px}
.crop-preview{aspect-ratio:4/3;overflow:hidden;background:var(--card)}
.crop-preview img{width:100%;height:100%;object-fit:cover}
#cover-dialog label{display:block;margin-top:16px;font-size:14px}
#cover-dialog input{display:block;width:100%;margin:12px 0;accent-color:var(--amber)}
.crop-actions{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.cover-mode .grid button{cursor:pointer}
</style>
</head>

const PUBLISHED_COVERS = {"a-super-dope-comedy-show":{"photo":"drive:1132FbZSLlJnaAzYtuiEMfjyT1tZjsI8j","x":12,"y":15},"justin-fuller-comedy":{"photo":"drive:14213wqwVy-IwyACTinTLghL8W86jD2_z","x":50,"y":7},"brian-mickens":{"photo":"drive:10FMfexFByA7YmaxPIQC8heezzvGTwOX1","x":0,"y":37},"dtla-fashion-shoot":{"photo":"drive:19ixQEI16CQC3iFELOuIXu-OiDkptDmel","x":50,"y":19},"hubby-jenkins":{"photo":"drive:1-IXqPlSP3_UF5E0a9-6ngHCz_izz1jWg","x":50,"y":9},"j-ward":{"photo":"drive:137EHUvxq0Gqxx3RJn4XSC9l3wlJ4VyHj","x":50,"y":25},"black-and-loud":{"photo":"drive:1L57VksRjksD0C3vpXoJiclNEN_gZqCwg","x":100,"y":50},"the-barnes":{"photo":"the-barnes-23.jpg","x":100,"y":50},"the-carvers":{"photo":"the-carvers-106.jpg","x":50,"y":50},"no-layups":{"photo":"no-layups-100.jpg","x":99,"y":50},"startup-huddle":{"photo":"startup-huddle-37.jpg","x":29,"y":50},"gigi-noire":{"photo":"gigi-13.jpg","x":100,"y":50},"khaled":{"photo":"khaled-43.jpg","x":74,"y":60},"justin-moyar-blues":{"photo":"justin-moyar-04.jpg","x":100,"y":0}};
const coverFor = p => {
  const d=(coverMode && coverDrafts[p.slug]) || PUBLISHED_COVERS[p.slug], ph=PHOTOS[p.key];
  return d && ph.some(f=>f[0]===d.photo) ? {photo:ph.find(f=>f[0]===d.photo),x:d.x,y:d.y} : {photo:ph[(p.cover||1)-1]||ph[0],x:50,y:50};
};
function persistCovers(){
  try { localStorage.setItem('tcoa-covers-v1',JSON.stringify(coverDrafts)); return true; }
  catch(e){ return false; }
}
function pickerToolbar(){
  if(!coverMode)return;
  const bar=document.createElement('aside');bar.className='cover-toolbar';
  bar.innerHTML='<strong>Choose album covers</strong><span id="cover-count"></span><button id="copy-covers">Copy all choices</button><p>Pick an album, then click a photo to adjust its cover. Choices stay in this browser. When finished, copy and paste them into our chat so I can publish them.</p><output id="cover-status" aria-live="polite"></output>';
  document.querySelector('.mast').after(bar);
  document.getElementById('copy-covers').onclick=async()=>{
    const payload={version:1,site:'thecityofangles.com',covers:Object.fromEntries(Object.entries(coverDrafts).filter(([slug])=>PROJECTS.some(p=>p.slug===slug)))};
    if(!Object.keys(payload.covers).length){document.getElementById('cover-status').textContent='Choose at least one cover first.';return;}
    const text='Publish these City of Angles album covers:\n'+JSON.stringify(payload);
    try { await navigator.clipboard.writeText(text); document.getElementById('cover-status').textContent='Copied. Paste into our chat to publish your covers.'; }
    catch(e){const area=document.getElementById('cover-export');area.hidden=false;area.value=text;area.focus();area.select();document.getElementById('cover-status').textContent='Copy the selected text and paste it into our chat.';}
  };
  const area=document.createElement('textarea');area.id='cover-export';area.hidden=true;area.setAttribute('aria-label','All cover choices');bar.append(area);
  updateCoverCount();
}
function updateCoverCount(){
  const el=document.getElementById('cover-count');
  if(el)el.textContent=PROJECTS.filter(p=>coverDrafts[p.slug]).length+' / '+PROJECTS.length+' selected';
}
function openCover(i){
  selectedCover=cur[i];
  const previous=coverDrafts[activeProject.slug], same=previous && previous.photo===selectedCover[0];
  const dialog=document.getElementById('cover-dialog');
  document.getElementById('cover-title').textContent=activeProject.title;
  document.getElementById('cover-preview').src=photoSrc(selectedCover,1600);
  document.getElementById('crop-x').value=same?previous.x:50;
  document.getElementById('crop-y').value=same?previous.y:50;
  updateCrop();dialog.showModal();
}
function updateCrop(){
  document.getElementById('cover-preview').style.objectPosition=document.getElementById('crop-x').value+'% '+document.getElementById('crop-y').value+'%';
}

function indexView(){
  document.title = "THE CITY of ANGLEs";
  view.innerHTML = `<section class="lede"><h2>Projects</h2><p>${PROJECTS.length} projects</p></section>
  <div class="projects">${PROJECTS.map(p => {
    const ph = p.key && PHOTOS[p.key];
    if (!ph) return `<div class="proj soon"><h3>${esc(p.title)}</h3><div class="lbl"><span class="n">Coming soon</span></div></div>`;
    const chosen=coverFor(p), c=chosen.photo;
    return `<a class="proj" href="#/${p.slug}"><img src="${photoSrc(c)}" width="${c[1]}" height="${c[2]}" style="object-position:${chosen.x}% ${chosen.y}%" alt="" loading="lazy"><div class="lbl"><h3>${esc(p.title)}</h3></div></a>`;
  }).join('')}</div>`;
}

let cur = [], idx = 0;
function projectView(p){
  activeProject = p;
  const ph = PHOTOS[p.key]; cur = [...ph];
  for (let i = cur.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1)); [cur[i], cur[j]] = [cur[j], cur[i]];
  }
  document.title = p.title.toUpperCase() + " | THE CITY of ANGLEs";
  const li = live.indexOf(p), prev = live[(li-1+live.length)%live.length], next = live[(li+1)%live.length];
  view.innerHTML = `<section class="phead"><div><a class="back" href="#/">← All projects</a><h2>${esc(p.title)}</h2></div><p>${p.year ? p.year + ' · ' : ''}${ph.length} photos${coverMode ? ' · Click a photo to choose its cover' : ''}</p></section>
  <div class="grid">${cur.map((f,i) => `<button data-i="${i}" aria-label="Open photo ${i+1}"><img src="${photoSrc(f)}" alt="${esc(p.title)}, photo ${i+1}" loading="lazy"></button>`).join('')}</div>
  <nav class="pnav"><a href="#/${prev.slug}"><small>Previous</small>${esc(prev.title)}</a><a href="#/${next.slug}" style="text-align:right"><small>Next</small>${esc(next.title)}</a></nav>`;
  view.querySelectorAll('.grid button').forEach(b => b.onclick = () => coverMode ? openCover(+b.dataset.i) : openLb(+b.dataset.i));
}

function route(){
  const slug = location.hash.replace(/^#\/?/, '');
  const p = PROJECTS.find(x => x.slug === slug && (x.folder || (x.key && PHOTOS[x.key])));
  if (p) projectView(p); else indexView();
  window.scrollTo(0,0);
}
window.addEventListener('hashchange', route);
window.addEventListener('popstate', route);
view.addEventListener('click', e => {
  const back = e.target.closest('a.back');
  if (!back || e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
  e.preventDefault();
  enter();
  if (location.hash !== '#/') history.pushState(null, '', '#/');
  route();
});

// Lightbox
const lb = document.getElementById('lb'), lbimg = document.getElementById('lbimg'), lbc = document.getElementById('lbc');
function show(){ const f = cur[idx]; lbimg.src = photoSrc(f,2400); lbc.textContent = (idx+1) + ' / ' + cur.length; }
function openLb(i){ idx = i; show(); lb.classList.add('on'); document.getElementById('lbx').focus(); }
function closeLb(){ lb.classList.remove('on'); }
function step(d){ idx = (idx + d + cur.length) % cur.length; show(); }
document.getElementById('lbx').onclick = closeLb;
document.getElementById('lbp').onclick = () => step(-1);
document.getElementById('lbn').onclick = () => step(1);
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;
  if (e.key === 'Escape') closeLb(); if (e.key === 'ArrowLeft') step(-1); if (e.key === 'ArrowRight') step(1);
});
let tx = null;
lb.addEventListener('touchstart', e => tx = e.touches[0].clientX, {passive:true});
lb.addEventListener('touchend', e => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 40) step(dx < 0 ? 1 : -1); tx = null; });

// Splash shows once per visit; deep links skip it.
function enter(){ document.body.classList.add('entered'); try { sessionStorage.setItem('tcoa-in','1'); } catch(e){} }
document.getElementById('enter').onclick = enter;
// The logo takes you back to the welcome splash.
const goHome = e => {
  e.preventDefault();
  try { sessionStorage.removeItem('tcoa-in'); } catch(err){}
  if (location.hash.length > 2) history.pushState(null, '', '#/');
  route();
  document.body.classList.remove('entered');
  document.getElementById('enter').focus();
};
document.querySelectorAll('.home').forEach(a => a.onclick = goHome);

if(coverMode){
  pickerToolbar();
  document.body.classList.add('cover-mode');
  const dialog=document.createElement('dialog');dialog.id='cover-dialog';dialog.setAttribute('aria-labelledby','cover-title');
  dialog.innerHTML='<form method="dialog"><h2 id="cover-title"></h2><div class="crop-preview"><img id="cover-preview" alt="Album cover crop preview"></div><label>Horizontal crop<input id="crop-x" type="range" min="0" max="100" value="50"></label><label>Vertical crop<input id="crop-y" type="range" min="0" max="100" value="50"></label><div class="crop-actions"><button value="cancel">Cancel</button><button id="save-cover" type="button">Use this cover</button></div></form>';
  document.body.append(dialog);
  ['crop-x','crop-y'].forEach(id=>document.getElementById(id).oninput=updateCrop);
  document.getElementById('save-cover').onclick=()=>{
    coverDrafts[activeProject.slug]={photo:selectedCover[0],x:+document.getElementById('crop-x').value,y:+document.getElementById('crop-y').value};
    const saved=persistCovers();updateCoverCount();dialog.close();
    document.getElementById('cover-status').textContent=activeProject.title+' cover selected.'+(saved?'':' Browser storage is unavailable; copy your choices before leaving.');
    history.pushState(null,'','#/');route();
  };
  enter();
}
let seen = false; try { seen = sessionStorage.getItem('tcoa-in') === '1'; } catch(e){}
if (seen || location.hash.length > 2) enter();
route();
</script>
</body>
</html>
